name: CD — Test & Build (push)

# Runs on every push. This workflow is intentionally non-opinionated about
# branch protection; do not mark it as a required status check if you want
# pushes/merges to proceed even when tests/builds fail.
on:
  push: {}

jobs:
  test-and-build:
    name: Test and build (non-blocking intent)
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - name: linux-aarch64
            runs-on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
          - name: macos-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - name: macos-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - name: ios-aarch64
            runs-on: macos-latest
            target: aarch64-apple-ios
            use_cross: false
          - name: ios-x86_64
            runs-on: macos-latest
            target: x86_64-apple-ios
            use_cross: false
          - name: android-aarch64
            runs-on: ubuntu-latest
            target: aarch64-linux-android
            use_cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests & build (Unix-like)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          echo "Matrix target=${{ matrix.target }} use_cross=${{ matrix.use_cross }}"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            docker run --rm -v "${{ github.workspace }}":/volume -w /volume rustembedded/cross:latest cross test --release --target ${{ matrix.target }} || true
            docker run --rm -v "${{ github.workspace }}":/volume -w /volume rustembedded/cross:latest cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }} || true
            # compile tests for the target; running tests on non-host targets may not execute them
            cargo test --workspace --all-features --target ${{ matrix.target }} || true
            cargo build --workspace --release --target ${{ matrix.target }}
          fi

      - name: Run tests & build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Matrix target=${{ matrix.target }} use_cross=${{ matrix.use_cross }}"
          # For windows native build, run tests and build
          if ($Env:RUNNER_OS -eq 'Windows') {
            cargo test --workspace --all-features
            cargo build --workspace --release
          }
