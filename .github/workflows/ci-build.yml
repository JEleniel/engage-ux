name: CI — Cross-platform build & release

on:
  push:
    branches: ['main']

jobs:
  build:
    name: Build matrix
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            ext: tar.gz
          - name: linux-aarch64
            runs-on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            ext: tar.gz
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: zip
          - name: macos-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            ext: tar.gz
          - name: macos-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            ext: tar.gz
          - name: ios-aarch64
            runs-on: macos-latest
            target: aarch64-apple-ios
            use_cross: false
            ext: tar.gz
          - name: ios-x86_64
            runs-on: macos-latest
            target: x86_64-apple-ios
            use_cross: false
            ext: tar.gz
          - name: android-aarch64
            runs-on: ubuntu-latest
            target: aarch64-linux-android
            use_cross: true
            ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # (Version is collected in the release job; we will add the version to artifact names at upload time.)

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          set -euo pipefail
          echo "Matrix target=${{ matrix.target }} use_cross=${{ matrix.use_cross }}"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # Use cross (docker) for cross builds (Linux aarch64, Android)
            docker run --rm -v "${{ github.workspace }}":/volume -w /volume rustembedded/cross:latest cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }} || true
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Collect binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p release/out
          TARGET_DIR=target/${{ matrix.target }}/release
          if [ -d "$TARGET_DIR" ]; then
            cp -a "$TARGET_DIR"/. release/out/ || true
          fi
          if [ -d target/release ]; then
            cp -a target/release/. release/out/ || true
          fi
          ls -la release/out || true

      - name: Add INSTALL file (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p release/out
          cat > release/out/INSTALL.txt <<'INSTALL'
          This archive contains compiled library artifacts for the engage-ux crate.

          Target: ${{ matrix.target }}

          These are library build artifacts (not an executable). To use them:
          - For Rust projects, add the crate as a workspace member or publish to a registry and depend via Cargo.toml.
          - See the repository README for development and usage instructions.

          INSTALL

      - name: Archive artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          ART="engage-ux-${{ matrix.name }}-${{ github.run_number }}.${{ matrix.ext }}"
          tar -C release -czf $ART out
          mkdir -p release/upload
          mv $ART release/upload/
          ls -la release/upload

      - name: Collect binaries (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release\out -Force | Out-Null
          $targetDir = "target\${{ matrix.target }}\release"
          if (Test-Path $targetDir) { Copy-Item -Path (Join-Path $targetDir '*') -Destination release\out -Recurse -Force }
          if (Test-Path 'target\release') { Copy-Item -Path 'target\release\*' -Destination release\out -Recurse -Force }
          Get-ChildItem release\out | Write-Host

      - name: Add INSTALL file (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release\out -Force | Out-Null
          "This archive contains compiled library artifacts for the engage-ux crate." | Out-File -FilePath release\out\INSTALL.txt -Encoding utf8
          "Target: ${{ matrix.target }}" | Out-File -FilePath release\out\INSTALL.txt -Append -Encoding utf8

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $out = "artifact-${{ matrix.name }}-${{ github.run_number }}.zip"
          Compress-Archive -Path release\out\* -DestinationPath $out -Force
          New-Item -ItemType Directory -Path release\upload -Force | Out-Null
          Move-Item -Path $out -Destination release\upload\$out
          Get-ChildItem release\upload | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifact
          path: release/upload

  release:
    name: Create draft release from Cargo.toml version
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          set -euo pipefail
          version=$(perl -0777 -ne 'print $1 if /\[package\].*?version\s*=\s*"([^"]+)"/s' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Failed to parse version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded files
        run: ls -la release-artifacts || true

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false

      - name: Upload release assets
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ steps.create_release.outputs.upload_url }}"
          echo "Upload URL: $UPLOAD_URL"
          shopt -s globstar || true
          for f in release-artifacts/**/*; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              name="v${{ steps.get_version.outputs.version }}-${base}"
              echo "Uploading $f as $name"
              curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$UPLOAD_URL?name=$name"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
