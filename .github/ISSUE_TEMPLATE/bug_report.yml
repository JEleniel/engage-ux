name: 'Bug report'
about: 'Report a reproducible bug. Clear, minimal reproduction steps help us fix issues faster.'
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form as completely as possible. Don't include secrets or private data.

  - type: dropdown
    id: severity
    attributes:
      label: 'Severity'
      description: 'How severe is the bug for your workflow?'
      options:
        - label: 'critical — crash / data loss'
          value: critical
        - label: 'high — major functionality broken'
          value: high
        - label: 'medium — partial loss of functionality / workaround exists'
          value: medium
        - label: 'low — cosmetic or minor issue'
          value: low

  - type: dropdown
    id: component
    attributes:
      label: 'Affected component'
      description: 'Which part of the codebase is affected?'
      options:
        - label: 'core'
          value: core
        - label: 'oal (platform backends)'
          value: oal
        - label: 'components'
          value: components
        - label: 'themes'
          value: themes
        - label: 'build/tests/docs/other'
          value: other

  - type: input
    id: summary
    attributes:
      label: 'One-line summary'
      description: 'Short, descriptive title of the problem.'
      placeholder: 'e.g. "Text input ignores input on Wayland"'

  - type: textarea
    id: steps
    attributes:
      label: 'Steps to reproduce'
      description: 'Provide a minimal, exact sequence that reproduces the issue. Prefer a small example repo or commands.'
      placeholder: |
        1. Build with `cargo build --features "..."`
        2. Run `./target/debug/example`
        3. Interact: click X, type Y

  - type: textarea
    id: expected
    attributes:
      label: 'Expected behavior'
      description: 'What you expected to happen.'
      placeholder: 'Describe the expected outcome.'

  - type: textarea
    id: actual
    attributes:
      label: 'Actual behavior'
      description: 'What actually happened. Paste error messages, stack traces or core dumps.'
      placeholder: 'Include exact error text or backtrace.'

  - type: input
    id: environment
    attributes:
      label: 'Environment (OS / toolchain)'
      description: 'OS, architecture, relevant toolchain versions (do not paste secrets).'
      placeholder: 'e.g. Ubuntu 22.04 aarch64, Rust 1.70.0'

  - type: textarea
    id: logs
    attributes:
      label: 'Relevant logs or backtrace'
      description: 'Paste log excerpts or attach a file using the attachments field below.'

  - type: input
    id: reproduction_link
    attributes:
      label: 'Minimal reproduction (optional)'
      description: 'Link to a small repo, gist, or pastebin that reproduces the issue. Highly encouraged.'
      placeholder: 'https://github.com/your/repro'

  - type: attachments
    id: attachments
    attributes:
      label: 'Attachments (screenshots, logs, artifacts)'

  - type: checkboxes
    id: checklist
    attributes:
      label: 'Pre-submit checklist'
      options:
        - label: 'I can reproduce this in a minimal environment'
        - label: 'I searched existing issues and PRs'
        - label: 'I included logs, backtrace, or a reproduction link where possible'
