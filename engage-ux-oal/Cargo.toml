[package]
name = "engage-ux-oal"
version.workspace = true
edition.workspace = true
description = "OS Abstraction Layer for Engage UX - provides cross-platform support"
repository.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true }
engage-ux-core = { path = "../engage-ux-core" }
keyboard-types = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skia-safe = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
wgpu = { workspace = true }
winit = { version = "0.30.12" }

[features]
# Enable native winit backend (creates real platform windows). Disabled by default
native-winit = []
# Enable Skia-based software and GPU renderers. When enabled, the
# `SkiaSoftwareRenderer` becomes available and future GPU paths will
# attempt to utilize Skia's GPU interfaces.
skia = []

[lints]
workspace = true
