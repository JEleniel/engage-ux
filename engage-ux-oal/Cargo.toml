[package]
name = "engage-ux-oal"
version.workspace = true
edition.workspace = true
description = "OS Abstraction Layer for Engage UX - provides cross-platform support"
repository.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }
chrono = { workspace = true }
engage-ux-core = { path = "../engage-ux-core" }
keyboard-types = { workspace = true }
lyon = "1.0"
pollster = { workspace = true }
rusttype = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
skia-safe = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
wgpu = { workspace = true }
wgt = { package = "wgpu-types", version = "27" }
winit = { version = "0.30.12" }

[features]
# Default features: keep `skia` enabled by default. Make `native-winit`
# opt-in so unit tests and CI can run the headless backend without pulling
# in native windowing/wgpu/winit code that may be platform-specific.
default = ["skia"]
native-winit = []
skia = []

[lints]
workspace = true
