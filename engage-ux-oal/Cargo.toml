[package]
name = "engage-ux-oal"
version.workspace = true
edition.workspace = true
description = "OS Abstraction Layer for Engage UX - provides cross-platform support"
repository.workspace = true
license.workspace = true

[dependencies]
engage-ux-core = { path = "../engage-ux-core" }
memfd = { version = "0.6", optional = true }
memmap2 = { version = "0.5", optional = true }
once_cell = { version = "1.17", optional = true }
tempfile = { version = "3", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
wayland-client = { version = "0.29", optional = true }
wayland-protocols = { version = "0.32", features = ["client"], optional = true }

[dev-dependencies]

[features]
# Minimal default feature set. Heavy optional backends (skia, skia-gpu) will be added later.
default = ["wayland"]
# Optional platform backends
wayland = [
  "memfd",
  "once_cell",
  "tempfile",
  "wayland-client",
  "wayland-protocols",
]

[lints]
workspace = true
