[package]
name = "xdg-protocols"
version = "0.1.0"
edition = "2024"
description = "Vendored Wayland XDG protocol bindings (generated at build time)."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
roxmltree = "0.17"
wayland-client = "0.29"

[dependencies.wayland_scanner]
package = "wayland-scanner"
version = "0.31"
optional = true

# The `wayland-scanner` proc-macro is optional; enable it via the
# `wayland-scanner` feature to generate bindings at compile time. When the
# feature is disabled the crate uses a checked-in fallback module.
[build-dependencies]
# No explicit build-deps for scanner: build.rs will be a no-op when using
# the proc-macro path. If we later need the programmatic API we can add
# a versioned build-dependency again.

[features]
default = []
"wayland-scanner" = ["wayland_scanner"]
